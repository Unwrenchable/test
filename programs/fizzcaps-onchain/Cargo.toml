[package]
name = "fizzcaps_onchain"
version = "0.1.0"
description = "Atomic Fizz Caps variant — Ed25519 loot vouchers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fizzcaps_onchain"

[features]
default = ["localnet"]
localnet = []
devnet = []
mainnet = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
mpl-token-metadata = "5.1.1"
solana-program = "2.3.0"

[dev-dependencies]
bincode = "1.3.3"
serde_json = "1"
