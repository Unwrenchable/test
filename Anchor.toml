[features]
seeds = false
skip-lint = false

# These ids must match the feature-gated declare_id! in
# programs/fizzcaps-onchain/src/lib.rs. scripts/check-declare-id.js enforces that.
# This variant currently uses one program id. Cluster separation is the voucher
# cluster_tag (localnet=3, devnet=2, mainnet=1), not a second pubkey.
# Do not run `anchor keys sync` before a build; it rewrites declare_id!.

[programs.localnet]
fizzcaps_onchain = "GDGexnGtZPoD1aHv6qg8hjeSspujwWnxJCtdrrj2gKpP"

[programs.devnet]
fizzcaps_onchain = "GDGexnGtZPoD1aHv6qg8hjeSspujwWnxJCtdrrj2gKpP"

[programs.mainnet-beta]
fizzcaps_onchain = "GDGexnGtZPoD1aHv6qg8hjeSspujwWnxJCtdrrj2gKpP"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"  # Change if your wallet is elsewhere

[test]
startup_wait = 5000
shutdown_wait = 2000

[test.validator]
url = "https://api.devnet.solana.com"

[[test.genesis]]
path = "target/deploy/fizzcaps_onchain.so"
balance = 1000000000000

[scripts]
test = "yarn install && yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
